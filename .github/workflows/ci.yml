name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cadence
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DEBUG: "1"
      SECRET_KEY: ci-only-not-a-real-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://cadence:cadence@localhost:5432/cadence
      CELERY_BROKER_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: pytest -v
