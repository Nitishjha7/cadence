{% extends "base.html" %}
{% block title %}Log in — Cadence{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white p-6 rounded shadow">
    <h1 class="text-xl font-bold mb-4">Log in</h1>
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
            <p class="text-red-600 text-sm mb-3">Wrong username or password.</p>
        {% endif %}
        <div class="mb-3">
            <label class="block text-sm font-medium mb-1">Username</label>
            <input type="text" name="username" class="w-full border rounded px-3 py-2" autofocus>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" name="password" class="w-full border rounded px-3 py-2">
        </div>
        <button type="submit" class="w-full bg-gray-900 text-white rounded py-2 font-medium">Log in</button>
    </form>
</div>
{% endblock %}
